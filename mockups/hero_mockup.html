<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:1400px;background:linear-gradient(165deg,#f2f4f8 0%,#e4e9f2 55%,#d8deeb 100%);overflow:hidden;position:relative;font-family:sans-serif}
/* soft ambient shapes */
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:520px;height:520px;background:#c7d5f5;top:-140px;right:-120px}
.b2{width:420px;height:420px;background:#dfe7f7;bottom:-100px;left:-120px}

/* laptop */
.laptop{position:absolute;left:70px;top:300px;width:900px}
.screen{
  width:860px;height:548px;margin:0 auto;border-radius:22px 22px 0 0;
  background:#0c1322;padding:16px 16px 22px;
  box-shadow:0 60px 120px rgba(15,30,70,.28), 0 20px 40px rgba(15,30,70,.18);
  position:relative;
}
.screen .cam{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#2a3245}
.screen .view{width:100%;height:100%;border-radius:8px;overflow:hidden;background:#fff}
.screen .view img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.base{
  width:900px;height:26px;margin:0 auto;border-radius:0 0 26px 26px;
  background:linear-gradient(180deg,#dfe3ea,#aeb6c4 60%,#8e97a8);
  position:relative;box-shadow:0 30px 50px rgba(15,30,70,.22);
}
.base::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:150px;height:11px;border-radius:0 0 14px 14px;background:#9aa3b3}
.floor{position:absolute;left:110px;top:1180px;width:820px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(15,30,70,.20),transparent 70%)}

/* phone */
.phone{
  position:absolute;right:88px;top:640px;width:246px;height:512px;
  background:#0c1322;border-radius:36px;padding:12px;
  box-shadow:0 50px 90px rgba(15,30,70,.35), 0 16px 30px rgba(15,30,70,.2);
  transform:rotate(4deg);
}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:88px;height:22px;background:#0c1322;border-radius:0 0 14px 14px;z-index:2}
.phone .view{width:100%;height:100%;border-radius:26px;overflow:hidden;background:#fff}
.phone .view img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.floor2{position:absolute;right:66px;top:1168px;width:300px;height:44px;border-radius:50%;background:radial-gradient(ellipse,rgba(15,30,70,.24),transparent 70%)}

/* small brand chip */
.chip{
  position:absolute;left:70px;top:170px;display:inline-flex;align-items:center;gap:10px;
  background:#fff;border-radius:14px;padding:14px 22px;box-shadow:0 16px 40px rgba(15,30,70,.14);
  font-weight:800;font-size:20px;color:#0b1f3f;letter-spacing:.02em;
}
.chip b{color:#1d5cff}
.chip .dot{width:10px;height:10px;border-radius:50%;background:#1fad53;box-shadow:0 0 10px #1fad53}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="chip"><span class="dot"></span>IJW<b>LABS</b> — live build</div>
<div class="floor"></div><div class="floor2"></div>
<div class="laptop">
  <div class="screen"><div class="cam"></div><div class="view"><img src="assets/site-desktop.png"></div></div>
  <div class="base"></div>
</div>
<div class="phone"><div class="notch"></div><div class="view"><img src="assets/site-mobile.png"></div></div>
</body></html>
